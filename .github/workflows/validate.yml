name: Prüfen (hassfest, HACS, Typen)

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # montags; Versionen fest angeheftet, Anheben von Hand
  workflow_dispatch:

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3  # master, Stand 2026-09-30

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration

  typen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: mypy --strict (Platin, Einstellungen in pyproject.toml)
        run: uv run --no-project --python 3.14 --with pytest-homeassistant-custom-component==0.13.367 --with mypy==2.3.1 mypy --strict custom_components/baustelle
